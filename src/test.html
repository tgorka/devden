<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Rag Chat with Speech</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    .chat-container {
      max-width: 600px;
      margin: 50px auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      background-color: #fff;
      overflow: hidden;
    }
    .chat-header {
      background-color: #6200ea;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }
    .chat-messages {
      height: 400px;
      overflow-y: auto;
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }
    .message {
      margin-bottom: 10px;
    }
    .user-message {
      text-align: right;
    }
    .bot-message {
      text-align: left;
    }
    .input-container {
      display: flex;
      padding: 10px;
    }
    input[type="text"] {
      flex-grow: 1;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    button {
      margin-left: 10px;
      padding: 10px 15px;
      background-color: #6200ea;
      color: #fff;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #3700b3;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">Custom Rag Chat with Speech</div>

  <div class="chat-messages" id="chatMessages">
    <!-- Messages will appear here -->
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Type or speak your message...">
    <button onclick="sendMessage()">Send</button>
    <button onclick="startSpeechRecognition()">🎤 Speak</button>
  </div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');

// Simulate the custom bot's response
function getBotResponse(userMessage) {
  // Replace this logic with your custom bot's API or response generation
  if (userMessage.toLowerCase().includes("hello")) {
    return "Hi there! How can I assist you today?";
  } else if (userMessage.toLowerCase().includes("bye")) {
    return "Goodbye! Have a great day!";
  } else {
    return "I'm not sure how to respond to that. Can you clarify?";
  }
}

// Function to send a message
function sendMessage() {
  if (userInput.value.trim() === "") return; // Prevent empty messages

  // Display user message
  const userMessageDiv = document.createElement('div');
  userMessageDiv.className = 'message user-message';
  userMessageDiv.textContent = userInput.value.trim();

  chatMessages.appendChild(userMessageDiv);

  // Scroll to the bottom of the chat
  chatMessages.scrollTop = chatMessages.scrollHeight;

  // Get bot response
  const botResponse = getBotResponse(userInput.value.trim());

  // Display bot message after a short delay
  setTimeout(() => {
    const botMessageDiv = document.createElement('div');
    botMessageDiv.className = 'message bot-message';
    botMessageDiv.textContent = botResponse;

    chatMessages.appendChild(botMessageDiv);

    // Scroll to the bottom of the chat
    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Use text-to-speech for the bot's response
    speak(botResponse);

    // Clear input field
    userInput.value = "";

  }, 500); // Simulate typing delay
}

// Text-to-Speech function
function speak(text) {
  const speechSynthesis = window.speechSynthesis;

  if (!speechSynthesis) {
    alert("Your browser does not support text-to-speech.");
    return;
  }

  const utterance = new SpeechSynthesisUtterance(text);

  // Set voice properties (optional)
  utterance.lang = 'en-US';

  speechSynthesis.speak(utterance);
}

// Speech-to-Text function
function startSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Your browser does not support speech recognition.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = 'en-US';

  recognition.start();

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;

    // Set the transcribed text in the input field
    userInput.value = transcript;

    // Automatically send the message after recognition
    sendMessage();

    console.log("Recognized speech:", transcript);
  };

  recognition.onerror = (event) => {
    console.error("Speech recognition error:", event.error);
    alert("Speech recognition error. Please try again.");
  };
}
</script>

</body>
</html>
